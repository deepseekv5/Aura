name: Build Aura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version

      - name: Build Aura.app
        run: |
          chmod +x ./make-app.sh
          # 在 CI 中不启动应用（make-app.sh 末尾有 open），此处用环境变量跳过
          SKIP_LAUNCH=1 ./make-app.sh

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Aura.app" "dist/Aura-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-macOS
          path: dist/Aura-macOS.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "dist/Aura-macOS.zip" --clobber
