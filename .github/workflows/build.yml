name: Build Aura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    # 必须使用 macOS 26+ runner：Liquid Glass（glassEffect）API 需要 macOS 26 SDK
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version

      - name: Verify version consistency
        run: |
          # 单一版本源：VERSION 必须与 app bundle 一致，防止更新循环
          VER="$(cat VERSION)"
          echo "VERSION=$VER"
          # 构建后校验 bundle 版本（见下方 Build 步骤）

      - name: Build Aura.app
        run: |
          chmod +x ./make-app.sh
          SKIP_LAUNCH=1 ./make-app.sh
          # 校验 bundle 版本 == VERSION
          BVER="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/Aura.app/Contents/Info.plist)"
          echo "bundle=$BVER expected=$(cat VERSION)"
          test "$BVER" = "$(cat VERSION)" || { echo "版本不一致！bundle=$BVER VERSION=$(cat VERSION)"; exit 1; }

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Aura.app" "dist/Aura-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-macOS
          path: dist/Aura-macOS.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "dist/Aura-macOS.zip" --clobber
